<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized Smart Lighting · 4 Floors</title>
  <!-- Bootstrap 5 + Icons + Chart.js -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #f0f3f8; padding: 1.8rem 0; min-height: 100vh; display: flex; align-items: center; }
    .dashboard-wrapper {
      max-width: 1480px; margin: 0 auto; width: 100%;
    }
    .main-card {
      background: #ffffff; border-radius: 40px; padding: 2rem 2rem 1.8rem;
      box-shadow: 0 30px 60px -20px rgba(0,20,40,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(2px);
    }
    .header-title {
      font-weight: 700; font-size: 1.8rem; letter-spacing: -0.02em;
      background: linear-gradient(145deg, #0a1f34, #1e3f60);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: inline-flex; align-items: center; gap: 12px;
    }
    .header-title i {
      background: #1e3f60; padding: 8px 12px; border-radius: 20px;
      font-size: 1.6rem; color: white; -webkit-text-fill-color: white;
      box-shadow: 0 6px 14px -6px #0a1f3450;
    }
    .stat-pill {
      background: white; padding: 0.4rem 1.2rem; border-radius: 60px;
      font-weight: 600; font-size: 0.8rem; border: 1px solid #e6edf5;
      color: #1a2b3e; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .stat-pill i { font-size: 1rem; }
    .stat-pill .num { font-weight: 700; margin-left: 2px; }
    .stat-pill.on { background: #e3f5ea; border-color: #b3dec9; color: #0a5535; }
    .stat-pill.off { background: #fde9e9; border-color: #f5c2c2; color: #962b2b; }
    .stat-pill.floor { background: #eef4fa; border-color: #ccdcec; color: #1b3b57; }

    /* floor cards */
    .floor-card {
      border: none; border-radius: 28px; background: white;
      box-shadow: 0 6px 18px -6px rgba(0, 20, 40, 0.06);
      border: 1px solid #e9f0f7; transition: all 0.2s; height: 100%;
    }
    .floor-card:hover { transform: translateY(-3px); box-shadow: 0 16px 28px -10px rgba(0,32,64,0.12); border-color: #c8daea; }
    .floor-card .card-body { padding: 1.5rem 1.2rem 1.2rem; display: flex; flex-direction: column; height: 100%; }
    .floor-title { font-weight: 700; font-size: 1.1rem; color: #0b2035; }
    .status-badge {
      font-weight: 600; font-size: 0.65rem; padding: 0.25rem 0.8rem; border-radius: 60px;
      text-transform: uppercase; letter-spacing: 0.02em;
      border: 1px solid transparent;
    }
    .status-badge.on { background: #def5e6; color: #0b5e3a; border-color: #a8dbbc; }
    .status-badge.off { background: #fde2e2; color: #a12b2b; border-color: #f5bebe; }
    .esp-badge {
      font-size: 0.6rem; font-weight: 600; padding: 0.2rem 0.7rem; border-radius: 40px;
      background: #eef2f6; color: #334155; display: inline-flex; align-items: center; gap: 4px;
    }
    .esp-badge.online { background: #def5e6; color: #0a5535; }
    .esp-badge.offline { background: #fde2e2; color: #a12b2b; }
    .lux-value { font-weight: 600; color: #153753; font-size: 0.95rem; }
    .meta-text { font-size: 0.7rem; color: #6b7f96; display: flex; align-items: center; gap: 4px; }
    .meta-text i { font-size: 0.7rem; }

    /* chart & history */
    .chart-container { background: #fafcff; border-radius: 28px; padding: 1rem 1rem 0.5rem; border: 1px solid #e9f0f7; }
    .filter-group .btn-outline-filter {
      border-radius: 40px; font-size: 0.7rem; font-weight: 600; padding: 0.3rem 1rem;
      border: 1px solid #d5dfea; color: #2f4a66; background: white;
    }
    .filter-group .btn-outline-filter.active { background: #0d2b4a; color: white; border-color: #0d2b4a; }
    .filter-group .btn-outline-filter:hover { background: #eef4fa; }

    .history-table {
      font-size: 0.8rem; border-collapse: separate; border-spacing: 0 6px;
    }
    .history-table td, .history-table th { padding: 0.6rem 0.8rem; border: none; background: white; }
    .history-table thead th { background: #f2f6fc; color: #1a314a; font-weight: 600; border-radius: 16px 16px 0 0; }
    .history-table tbody tr { border-radius: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .history-table tbody td { background: #fafcff; border-bottom: 1px solid #edf3fa; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 12px; margin-right: 6px; }
    .status-dot.on { background: #1f8b4c; }
    .status-dot.off { background: #b0bcca; }

    .footer-credit { font-size: 0.7rem; color: #8194ab; border-top: 1px solid #eef3f9; padding-top: 1.2rem; margin-top: 1.8rem; }

    @media (max-width: 576px) { .main-card { padding: 1.2rem; } }
  </style>
</head>
<body>
<div class="container dashboard-wrapper">
  <div class="main-card">

    <!-- header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div class="header-title"><i class="bi bi-building"></i> Centralized Smart Lighting</div>
      <div class="d-flex flex-wrap gap-2">
        <span class="stat-pill floor"><i class="bi bi-layers"></i> Floors <span class="num">4</span></span>
        <span class="stat-pill on"><i class="bi bi-lightbulb-fill"></i> ON <span class="num" id="total-on">0</span></span>
        <span class="stat-pill off"><i class="bi bi-lightbulb-off-fill"></i> OFF <span class="num" id="total-off">0</span></span>
        <span class="stat-pill"><i class="bi bi-wifi"></i> ESP <span id="esp-online-count" class="num">0</span>/<span id="esp-total-count" class="num">4</span> online</span>
      </div>
    </div>

    <!-- 4 floor cards -->
    <div class="row g-4 mb-4" id="floor-grid">
      <!-- each floor card is populated via JS with mock data, but we can also render from backend -->
    </div>

    <!-- chart + filter -->
    <div class="row g-4 mt-2">
      <div class="col-lg-7">
        <div class="chart-container">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
            <span class="fw-semibold" style="color: #0b2035; font-size: 0.9rem;"><i class="bi bi-graph-up-arrow me-1"></i>Intensity (Lux) · last 24h</span>
            <div class="filter-group d-flex gap-1">
              <button class="btn btn-outline-filter active" data-range="1h">1h</button>
              <button class="btn btn-outline-filter" data-range="24h">24h</button>
              <button class="btn btn-outline-filter" data-range="7d">7d</button>
            </div>
          </div>
          <canvas id="intensityChart" height="140" style="max-height:170px; width:100%"></canvas>
          <!-- floor filter pills -->
          <div class="d-flex flex-wrap gap-2 mt-2" id="chart-floor-filters">
            <span class="badge bg-dark rounded-pill filter-floor" data-floor="all" style="cursor:pointer; background:#0d2b4a !important;">All</span>
            <span class="badge bg-secondary rounded-pill filter-floor" data-floor="Lantai 1" style="cursor:pointer;">Lantai 1</span>
            <span class="badge bg-secondary rounded-pill filter-floor" data-floor="Lantai 2" style="cursor:pointer;">Lantai 2</span>
            <span class="badge bg-secondary rounded-pill filter-floor" data-floor="Lantai 3" style="cursor:pointer;">Lantai 3</span>
            <span class="badge bg-secondary rounded-pill filter-floor" data-floor="Lantai 4" style="cursor:pointer;">Lantai 4</span>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div style="background:#fafcff; border-radius:28px; padding:0.8rem 0.8rem 0.2rem; border:1px solid #e9f0f7; height:100%;">
          <span class="fw-semibold" style="color:#0b2035; font-size:0.9rem;"><i class="bi bi-clock-history me-1"></i>History</span>
          <div style="max-height:200px; overflow-y:auto; margin-top:6px;">
            <table class="table history-table" id="history-table">
              <thead><tr><th>Time</th><th>Floor</th><th>Status</th><th>Lux</th></tr></thead>
              <tbody id="history-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- footer -->
    <div class="footer-credit d-flex flex-wrap justify-content-between">
      <span><i class="bi bi-esp8266"></i> IoT · ESP32</span>
      <span><i class="bi bi-wifi"></i> real‑time · <span id="live-indicator" style="display:inline-block; width:8px; height:8px; background:#2b9c5c; border-radius:50%; margin-left:4px;"></span> live</span>
    </div>
  </div>
</div>

<script>
  // ----- MOCK DATA for 4 floors (simulate realtime) -----
  const floorNames = ['Lantai 1', 'Lantai 2', 'Lantai 3', 'Lantai 4'];
  // initial states
  let floorData = [
    { id: 1, name: 'Lantai 1', status: 'on', lux: 720, esp: 'online', lastUpdated: new Date().toLocaleString('en-US', {hour12:false}) },
    { id: 2, name: 'Lantai 2', status: 'off', lux: 28, esp: 'online', lastUpdated: new Date().toLocaleString('en-US', {hour12:false}) },
    { id: 3, name: 'Lantai 3', status: 'on', lux: 810, esp: 'offline', lastUpdated: new Date().toLocaleString('en-US', {hour12:false}) },
    { id: 4, name: 'Lantai 4', status: 'off', lux: 15, esp: 'online', lastUpdated: new Date().toLocaleString('en-US', {hour12:false}) }
  ];

  // history mock (10 entries)
  let historyEntries = [
    { time: '10:30', floor: 'Lantai 1', status: 'ON', lux: 850 },
    { time: '10:25', floor: 'Lantai 3', status: 'OFF', lux: 20 },
    { time: '10:15', floor: 'Lantai 2', status: 'ON', lux: 690 },
    { time: '10:00', floor: 'Lantai 4', status: 'OFF', lux: 12 },
    { time: '09:45', floor: 'Lantai 1', status: 'ON', lux: 780 },
    { time: '09:30', floor: 'Lantai 3', status: 'OFF', lux: 18 },
    { time: '09:10', floor: 'Lantai 2', status: 'ON', lux: 710 },
    { time: '08:55', floor: 'Lantai 4', status: 'ON', lux: 430 },
    { time: '08:40', floor: 'Lantai 1', status: 'OFF', lux: 22 },
    { time: '08:20', floor: 'Lantai 3', status: 'ON', lux: 790 }
  ];

  // ----- helpers -----
  function renderFloorCards() {
    const grid = document.getElementById('floor-grid');
    grid.innerHTML = '';
    floorData.forEach((f, idx) => {
      const col = document.createElement('div');
      col.className = 'col-12 col-sm-6 col-xl-3';
      const statusClass = f.status === 'on' ? 'on' : 'off';
      const espClass = f.esp === 'online' ? 'online' : 'offline';
      const luxVal = f.lux;
      col.innerHTML = `
        <div class="card floor-card" data-floor-id="${f.id}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <span class="floor-title">${f.name}</span>
              <span class="status-badge ${statusClass}"><i class="bi bi-circle-fill" style="font-size:0.35rem; vertical-align:middle; margin-right:4px;"></i> ${f.status.toUpperCase()}</span>
            </div>
            <div class="mt-2 d-flex align-items-center gap-2">
              <span style="font-size:0.7rem; font-weight:500; color:#43566e;">Intensity</span>
              <div class="progress w-100" style="height:4px; background:#e3eaf2; border-radius:12px;">
                <div class="progress-bar" role="progressbar" style="width:${luxVal > 100 ? Math.min(luxVal/10, 100) : luxVal*2}%; background:${f.status==='on' ? '#1f8b4c' : '#b0c4db'}; border-radius:12px;"></div>
              </div>
              <span class="small fw-semibold lux-value">${luxVal} Lux</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <span class="esp-badge ${espClass}"><i class="bi bi-${f.esp === 'online' ? 'wifi' : 'wifi-off'}"></i> ${f.esp.toUpperCase()}</span>
              <span class="meta-text"><i class="bi bi-clock-history"></i> <span class="last-updated-floor">${f.lastUpdated}</span></span>
            </div>
            <div class="btn-group-card mt-2 d-flex gap-2">
              <button class="btn btn-sm btn-toggle-floor" style="background:#0d2b4a; border:none; border-radius:40px; font-weight:600; font-size:0.7rem; padding:0.25rem 0.5rem; color:white; flex:2;">Toggle</button>
              <button class="btn btn-sm btn-refresh-floor" style="background:transparent; border:1px solid #d5dfea; border-radius:40px; font-weight:500; font-size:0.7rem; padding:0.25rem 0.5rem; color:#2b3f5a; flex:1;"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(col);
    });
    attachFloorEvents();
    updateSummary();
  }

  function updateSummary() {
    const onCount = floorData.filter(f => f.status === 'on').length;
    const offCount = floorData.length - onCount;
    document.getElementById('total-on').textContent = onCount;
    document.getElementById('total-off').textContent = offCount;
    const online = floorData.filter(f => f.esp === 'online').length;
    document.getElementById('esp-online-count').textContent = online;
    document.getElementById('esp-total-count').textContent = floorData.length;
  }

  function attachFloorEvents() {
    document.querySelectorAll('.btn-toggle-floor').forEach((btn, idx) => {
      btn.addEventListener('click', function(e) {
        const card = this.closest('.floor-card');
        const id = parseInt(card.dataset.floorId);
        const floor = floorData.find(f => f.id === id);
        if (!floor) return;
        floor.status = floor.status === 'on' ? 'off' : 'on';
        // update lux mock
        floor.lux = floor.status === 'on' ? Math.floor(600 + Math.random()*300) : Math.floor(10 + Math.random()*30);
        floor.lastUpdated = new Date().toLocaleString('en-US', {hour12:false});
        // add history entry
        historyEntries.unshift({
          time: new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:false}),
          floor: floor.name,
          status: floor.status.toUpperCase(),
          lux: floor.lux
        });
        if (historyEntries.length > 20) historyEntries.pop();
        renderFloorCards();
        renderHistory();
        updateChartData();
      });
    });

    document.querySelectorAll('.btn-refresh-floor').forEach((btn, idx) => {
      btn.addEventListener('click', function(e) {
        const card = this.closest('.floor-card');
        const id = parseInt(card.dataset.floorId);
        const floor = floorData.find(f => f.id === id);
        if (!floor) return;
        // simulate refresh: toggle esp random, update lux
        floor.esp = Math.random() > 0.2 ? 'online' : 'offline';
        floor.lux = floor.status === 'on' ? Math.floor(500 + Math.random()*400) : Math.floor(10 + Math.random()*30);
        floor.lastUpdated = new Date().toLocaleString('en-US', {hour12:false});
        renderFloorCards();
        updateChartData();
      });
    });
  }

  // ----- Chart.js -----
  let intensityChart = null;
  function initChart() {
    const ctx = document.getElementById('intensityChart').getContext('2d');
    intensityChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['00:00','02:00','04:00','06:00','08:00','10:00','12:00','14:00','16:00','18:00','20:00','22:00'],
        datasets: [
          { label: 'Lantai 1', data: [120,110,100,150,700,750,780,800,720,650,400,200], borderColor: '#1f6e9e', backgroundColor: 'transparent', tension:0.3, borderWidth:2, pointRadius:1 },
          { label: 'Lantai 2', data: [80,70,60,90,650,720,740,760,680,600,350,150], borderColor: '#2b9c5c', backgroundColor: 'transparent', tension:0.3, borderWidth:2, pointRadius:1 },
          { label: 'Lantai 3', data: [40,30,20,50,600,690,710,730,660,580,300,100], borderColor: '#b07c3a', backgroundColor: 'transparent', tension:0.3, borderWidth:2, pointRadius:1 },
          { label: 'Lantai 4', data: [20,15,10,30,400,500,520,540,480,420,200,60], borderColor: '#b03a3a', backgroundColor: 'transparent', tension:0.3, borderWidth:2, pointRadius:1 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, grid: { color: '#eef2f7' } }, x: { grid: { display: false } } }
      }
    });
  }

  function updateChartData() {
    // mock update: shift data randomly to simulate realtime
    if (intensityChart) {
      const datasets = intensityChart.data.datasets;
      datasets.forEach((ds, idx) => {
        const base = [120,80,40,20][idx];
        const newData = ds.data.map((v, i) => {
          const hour = i;
          let val = base + Math.sin(hour/2) * 50 + Math.random() * 40;
          if (hour > 5 && hour < 20) val += 500 + Math.random() * 200;
          return Math.max(10, Math.min(900, Math.floor(val)));
        });
        ds.data = newData;
      });
      intensityChart.update();
    }
  }

  // ----- History table -----
  function renderHistory() {
    const tbody = document.getElementById('history-body');
    tbody.innerHTML = '';
    historyEntries.slice(0, 12).forEach(h => {
      const tr = document.createElement('tr');
      const statusDot = h.status === 'ON' ? 'on' : 'off';
      tr.innerHTML = `<td>${h.time}</td><td>${h.floor}</td><td><span class="status-dot ${statusDot}"></span>${h.status}</td><td>${h.lux}</td>`;
      tbody.appendChild(tr);
    });
  }

  // ----- filter buttons (chart) -----
  document.querySelectorAll('.filter-group .btn-outline-filter').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-group .btn-outline-filter').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      // update chart labels / data mock
      const range = this.dataset.range;
      let labels;
      if (range === '1h') labels = Array.from({length:12}, (_,i) => `${i*5}min`);
      else if (range === '24h') labels = ['00:00','02:00','04:00','06:00','08:00','10:00','12:00','14:00','16:00','18:00','20:00','22:00'];
      else labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      if (intensityChart) {
        intensityChart.data.labels = labels;
        intensityChart.update();
      }
    });
  });

  // floor filter for chart (highlight)
  document.querySelectorAll('.filter-floor').forEach(el => {
    el.addEventListener('click', function() {
      const floor = this.dataset.floor;
      document.querySelectorAll('.filter-floor').forEach(b => b.classList.remove('bg-dark'));
      this.classList.add('bg-dark');
      // just visual, we keep all datasets visible for demo
    });
  });

  // ----- live indicator pulse -----
  setInterval(() => {
    const ind = document.getElementById('live-indicator');
    if (ind) ind.style.opacity = ind.style.opacity === '0.4' ? '1' : '0.4';
  }, 1200);

  // ----- init -----
  document.addEventListener('DOMContentLoaded', function() {
    renderFloorCards();
    renderHistory();
    initChart();
    // simulate live update every 8s
    setInterval(() => {
      floorData.forEach(f => {
        f.lux = f.status === 'on' ? Math.floor(500 + Math.random()*400) : Math.floor(10 + Math.random()*30);
        f.lastUpdated = new Date().toLocaleString('en-US', {hour12:false});
        if (Math.random() > 0.85) f.esp = f.esp === 'online' ? 'offline' : 'online';
      });
      renderFloorCards();
      updateChartData();
      // add random history
      const randomFloor = floorData[Math.floor(Math.random() * floorData.length)];
      historyEntries.unshift({
        time: new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit', hour12:false}),
        floor: randomFloor.name,
        status: randomFloor.status.toUpperCase(),
        lux: randomFloor.lux
      });
      if (historyEntries.length > 20) historyEntries.pop();
      renderHistory();
    }, 8000);
  });
</script>
</body>
</html>
